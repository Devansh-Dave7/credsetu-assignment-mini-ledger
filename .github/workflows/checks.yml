name: MiniLedger checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: miniledger
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: miniledger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U miniledger -d miniledger_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://miniledger:ci-only-password@localhost:5432/miniledger_test
      JWT_SECRET: ci-test-secret-at-least-32-characters
      MOCK_OTP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run check
