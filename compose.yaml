name: miniledger
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: miniledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: miniledger
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - ledger-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniledger -d miniledger"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  ledger-data:
